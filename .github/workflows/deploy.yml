name: Build & Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout main
        uses: actions/checkout@v4

      - name: 📦 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      # NOTE : pas d'injection .env.production volontairement.
      # Les valeurs Supabase (URL + anon key, publiques par nature) sont
      # hardcodées en fallback dans src/lib/supabase.js. Comme ça pas de
      # risque qu'un secret mal configuré sur GitHub bloque le build.

      - name: 🏗️ Build production bundle
        run: npm run build

      - name: 🚀 Push dist/ to production branch (linear history)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: production
          force_orphan: false
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "deploy: ${{ github.event.head_commit.message }}"

      - name: 🔔 Notify Hostinger to pull
        env:
          HOOK_URL: ${{ secrets.HOSTINGER_DEPLOY_HOOK }}
        continue-on-error: true
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "ℹ️ No HOSTINGER_DEPLOY_HOOK secret — Hostinger pulls automatically."
            exit 0
          fi
          for ATTEMPT in 1 2 3; do
            HTTP=$(curl -s -o /tmp/resp -w "%{http_code}" \
                    -X POST -H "Content-Type: application/json" \
                    --data '{"ref":"refs/heads/production"}' \
                    "$HOOK_URL" || echo "000")
            echo "  Attempt $ATTEMPT → HTTP $HTTP"
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || [ "$HTTP" = "202" ] || [ "$HTTP" = "204" ]; then
              echo "✅ Hostinger acknowledged."
              exit 0
            fi
            sleep 2
          done
          echo "⚠️ Webhook didn't return 2xx — Hostinger will pull on its own."

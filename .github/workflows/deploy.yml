name: Build & Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout main
        uses: actions/checkout@v4

      - name: 📦 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔧 Inject Supabase env vars
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production

      - name: 🏗️ Build production bundle
        run: npm run build

      - name: 🚀 Push dist/ to production branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: production
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "deploy: ${{ github.event.head_commit.message }}"

      - name: 🔔 Notify Hostinger to pull
        env:
          HOOK_URL: ${{ secrets.HOSTINGER_DEPLOY_HOOK }}
        continue-on-error: true
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "ℹ️  No HOSTINGER_DEPLOY_HOOK secret — Hostinger will auto-pull from production branch on its own polling cycle."
            exit 0
          fi
          # Hostinger expects a JSON-ish payload — try several formats, log all responses
          echo "→ Calling Hostinger deploy hook…"
          for ATTEMPT in 1 2 3; do
            HTTP=$(curl -s -o /tmp/resp -w "%{http_code}" \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -H "User-Agent: GitHub-Actions-CRM179" \
                    --data '{"ref":"refs/heads/production","branch":"production"}' \
                    "$HOOK_URL" || echo "000")
            echo "  Attempt $ATTEMPT → HTTP $HTTP"
            cat /tmp/resp 2>/dev/null | head -3
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || [ "$HTTP" = "202" ] || [ "$HTTP" = "204" ]; then
              echo "✅ Hostinger acknowledged."
              exit 0
            fi
            sleep 2
          done
          echo "⚠️  Webhook didn't return 2xx, but Hostinger should still auto-pull from production within a few min."
          echo "   The site will be up regardless — the dist/ is committed to the production branch."
